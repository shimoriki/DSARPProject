# Repo pool for the mixed-operator study (spec section 9), fixed 2026-11-03 before any repo was cloned.
# Split rule: sha256('apache/<name>') first hex digit 0-7 -> discovery, 8-f -> holdout.
# Repos already used in pilots or confirmatory runs are discovery regardless of hash.
used_discovery: [pdfbox, tika, commons-validator, logging-log4j2, struts, karaf, opennlp,
  commons-collections, maven, guava, commons-csv, commons-email, commons-codec, commons-cli,
  commons-text, commons-io, commons-lang]
repositories:
  - {project_id: apache-commons-beanutils, repo_url: https://github.com/apache/commons-beanutils, split: discovery}
  - {project_id: apache-commons-configuration, repo_url: https://github.com/apache/commons-configuration, split: holdout}
