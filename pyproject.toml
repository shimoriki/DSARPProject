[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsarp-evidence-refactoring-agent"
version = "0.1.0"
description = "DSARP Evidence-Based Refactoring Agent — evidence-grounded, ranked Java refactoring suggestions."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "DSARP" }]
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "networkx>=3.1",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
# Local laptop extras
local = [
    "streamlit>=1.30",
    "scikit-learn>=1.3",
    "lightgbm>=4.1",
    "plotly>=5.18",
    "pyvis>=0.3.2",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
# HPC extras (installed on cluster; heavy)
hpc = [
    "requests>=2.31",
    "scikit-learn>=1.3",
    "lightgbm>=4.1",
]
dev = [
    "pytest>=7.4",
]

[project.scripts]
dsarp-local = "dsarp.cli:local_main"
dsarp-hpc = "dsarp.cli:hpc_main"
dsarp = "dsarp.cli:main"

[tool.setuptools.packages.find]
include = ["dsarp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
